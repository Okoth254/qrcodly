name: Docker build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'packages/**'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'compose.production.yaml'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [main, feat/docker-production-readiness]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'packages/**'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docker-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: qrcodly-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          tags: qrcodly-frontend:ci
          build-args: |
            NEXT_PUBLIC_FRONTEND_URL=https://example.test
            NEXT_PUBLIC_API_URL=https://api.example.test/api/v1
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_docker_ci
            NEXT_PUBLIC_STRIPE_PRO_PRICE_ID_MONTHLY=price_ci_monthly
            NEXT_PUBLIC_STRIPE_PRO_PRICE_ID_ANNUAL=price_ci_annual
            NEXT_PUBLIC_STRIPE_ADDON_DOMAIN_PRICE_ID_MONTHLY=price_ci_addon_monthly
            NEXT_PUBLIC_STRIPE_ADDON_DOMAIN_PRICE_ID_ANNUAL=price_ci_addon_annual
            NEXT_PUBLIC_GOOGLE_API_KEY=docker-ci-placeholder
            NEXT_PUBLIC_CLERK_JS_URL=/__clerk-js/dist/clerk.browser.min.js
            NEXT_PUBLIC_SENTRY_DSN=https://publickey@o0.ingest.sentry.io/0
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=test
            INTERNAL_API_SECRET=0123456789abcdef0123456789abcdef
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
